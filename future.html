<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Authoring | Career Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__title">Career Quiz</h1>
            <nav class="nav">
                <button class="nav__toggle" id="menuToggle" aria-label="Toggle menu">
                    <span class="nav__toggle-icon"></span>
                </button>
                <ul class="nav__menu" id="menu">
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="dailies.html" class="nav__link">Dailies</a></li>
                    <li><a href="future.html" class="nav__link nav__link--active">Future Authoring</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main main--future">
        <div class="future" id="future">
            <div class="future__card">
                <!-- Progress Bar -->
                <div class="progress">
                    <div class="progress__bar">
                        <div class="progress__fill" id="progress-fill"></div>
                    </div>
                    <span class="progress__text" id="progress-text">Step 1 of 22</span>
                </div>

                <!-- Dynamic Content Container -->
                <div id="content-container" class="future__content">
                    <!-- Content will be rendered here by JavaScript -->
                </div>

                <!-- Navigation Buttons -->
                <div class="future__nav">
                    <button class="btn btn--secondary" id="prev-btn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        Previous
                    </button>
                    <button class="btn btn--primary" id="next-btn">
                        Next
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Create a vision for your ideal future</p>
    </footer>

    <script src="future-authoring.js"></script>
</body>
</html>
