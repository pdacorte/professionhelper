<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Authoring</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Profession Quiz</h1>
        <nav>
            <button id="menuToggle">Menu ▼</button>
            <ul id="menu">
                <li><a href="https://pdacorte.github.io/professionhelper/">Home</a></li>
                <li><a href="https://pdacorte.github.io/professionhelper/dailies.html">Dailies</a></li>
                <li><a href="https://pdacorte.github.io/professionhelper/future.html">Future Authoring</a></li>
            </ul>
        </nav>
    </header>

    <div class="app-container" style="width:100%;height:85vh;">
        

        <div style="width:100%;height:100%;">
            <iframe
                src="https://futurethinking.streamlit.app/?embed=true"
                style="height: 100%; width: 100%;"
            ></iframe>
        </div>

        
    </div>
    
    <footer>
        <p>Discover the ideal career for you</p>
    </footer>

    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.getElementById('menuToggle');
    const menu = document.getElementById('menu');

    menuToggle.addEventListener('click', function() {
        menu.classList.toggle('show');
    });

    // Close the menu when clicking outside of it
    document.addEventListener('click', function(event) {
        if (!menu.contains(event.target) && !menuToggle.contains(event.target)) {
            menu.classList.remove('show');
        }
    });
});
    </script>
</body>
</html>
